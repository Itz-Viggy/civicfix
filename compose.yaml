name: civicfix
services:
  app:
    image: civicfix:module8
    build:
      context: .
      target: module8
    init: true
    environment:
      CIVICFIX_MODE: ${CIVICFIX_MODE:-real}
      CIVICFIX_CLIP_URL: ${CIVICFIX_CLIP_URL:-http://host.docker.internal:8001}
      CIVICFIX_CLIP_TOKEN: ${CIVICFIX_CLIP_TOKEN:-}
      CIVICFIX_ANALYSIS_TIMEOUT: ${CIVICFIX_ANALYSIS_TIMEOUT:-75}
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - app-data:/var/lib/civicfix
    stop_grace_period: 30s
  prometheus:
    image: prom/prometheus:v3.13.3
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/etc/grafana/dashboards:ro
  browser-test:
    profiles: [test]
    build:
      context: .
      target: browser-test
    network_mode: service:app
    environment:
      CIVICFIX_E2E_BASE_URL: http://127.0.0.1:8000
      CIVICFIX_E2E_REAL: ${CIVICFIX_E2E_REAL:-0}
    depends_on:
      app:
        condition: service_healthy
volumes:
  app-data:
