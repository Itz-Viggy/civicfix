[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "civicfix-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi", "uvicorn", "pydantic", "python-multipart", "Pillow", "sqlalchemy", "alembic", "shapely", "pyproj"]
[tool.pytest.ini_options]
pythonpath = [".", "../.."]
testpaths = ["tests"]
